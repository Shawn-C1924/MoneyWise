<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>MoneyWise</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#111827}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:88px}.top{padding:22px 18px 12px;background:white;position:sticky;top:0;z-index:3;border-bottom:1px solid #eee}
h1{font-size:28px;margin:0 0 4px}.muted{color:#6b7280;font-size:14px}.card{background:white;border-radius:18px;padding:18px;margin:14px 14px;box-shadow:0 2px 10px #0000000b}
.big{font-size:36px;font-weight:750;margin:8px 0}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#111827;border-radius:99px}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:650;background:#111827;color:white;font-size:15px}
button.secondary{background:#eef0f3;color:#111827}button.danger{background:#fee2e2;color:#991b1b}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:5}
.nav button{background:white;color:#6b7280;border-radius:0;padding:13px 10px;flex:1;max-width:130px;font-size:12px}
.nav button.active{color:#111827;font-weight:800}.nav span{display:block;font-size:20px;line-height:20px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:14px;padding:13px}.metric b{display:block;font-size:19px;margin-top:4px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 10px}
.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{background:white;width:100%;border-radius:22px 22px 0 0;padding:20px 18px 30px;max-height:90vh;overflow:auto}
.small{font-size:13px}.section-title{font-size:18px;font-weight:750;margin:20px 14px 8px}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div class="nav">
<button data-tab="home" class="active"><span>⌂</span>Home</button>
<button data-tab="spend"><span>＋</span>Spend</button>
<button data-tab="budget"><span>☷</span>Budget</button>
<button data-tab="plan"><span>◷</span>Plan</button>
</div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const DEFAULT = {
  startingSavings:34000, annualPay:32000, target:75000, flexible:288,
  recurring:[
    ["Gas",40],["Xiaomi",3.5],["F1",50/12],["iCloud",12],["ChatGPT",8],
    ["Netflix",20],["Gamepass",20],["YouTube",0.8],["Mobile plan",17.15],
    ["iRacing",8],["Hair",28],["Cloudigo",3.4],["Gym",180/12],
    ["Car insurance",400/12],["Car license",300/12]
  ],
  gifts:100, weekendFood:40*52/12, general:100,
  transactions:[], carry:0
};
let state;
try { state=JSON.parse(localStorage.getItem("moneywise")||"null") || structuredClone(DEFAULT); }
catch(e){ state=structuredClone(DEFAULT); }
function save(){localStorage.setItem("moneywise",JSON.stringify(state));}
function euro(n){return new Intl.NumberFormat("en-IE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n)}
function monthKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function monthName(){return new Date().toLocaleString(undefined,{month:"long",year:"numeric"})}
function recurring(){return state.recurring.reduce((a,x)=>a+x[1],0)}
function planned(){return recurring()+state.gifts+state.weekendFood+state.general}
function txs(){return state.transactions.filter(x=>x.month===monthKey())}
function spent(){return txs().reduce((a,x)=>a+x.amount,0)}
function available(){return state.flexible+state.carry}
function remaining(){return available()-spent()}
function projected(){return state.startingSavings+(state.annualPay/12-planned()-state.flexible)*24}
function render(tab="home"){
 const app=document.getElementById("app");
 if(tab==="home") app.innerHTML=home();
 if(tab==="spend") app.innerHTML=spend();
 if(tab==="budget") app.innerHTML=budget();
 if(tab==="plan") app.innerHTML=plan();
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
}
function home(){
 const a=available(), r=remaining(), pct=a?Math.max(0,Math.min(100,spent()/a*100)):0;
 return `<div class="top"><h1>MoneyWise</h1><div class="muted">${monthName()}</div></div>
 <div class="card"><div class="muted">Flexible spending left</div><div class="big">${euro(r)}</div>
 <div class="progress"><div style="width:${pct}%"></div></div>
 <div class="row small"><span>Spent ${euro(spent())}</span><span>Available ${euro(a)}</span></div>
 <button onclick="openAdd()">Add spending</button></div>
 <div class="grid"><div class="metric"><span class="muted">Base allowance</span><b>${euro(state.flexible)}</b></div>
 <div class="metric"><span class="muted">Carry-forward</span><b>${euro(state.carry)}</b></div></div>
 <div class="card"><b>Month-end carry</b><p class="muted">Unused flexible money can be carried into the next month.</p>
 <button class="secondary" onclick="carry()">Carry ${euro(Math.max(0,r))} forward</button></div>`;
}
function spend(){
 return `<div class="top"><h1>Spending</h1><div class="muted">${monthName()}</div></div>
 <div class="card"><div class="row"><b>Remaining</b><b>${euro(remaining())}</b></div>
 ${txs().length?txs().map(x=>`<div class="item"><div class="row"><span>${esc(x.desc)} <span class="pill">${esc(x.cat)}</span></span><span>${euro(x.amount)}</span></div>
 <button class="danger small" onclick="delTx('${x.id}')">Delete</button></div>`).join(""):'<p class="muted">No spending recorded this month.</p>'}
 </div><div class="card"><button onclick="openAdd()">+ Add spending</button></div>`;
}
function budget(){
 return `<div class="top"><h1>Budget</h1><div class="muted">Your planned monthly costs</div></div>
 <div class="card"><div class="row"><b>Recurring</b><b>${euro(recurring())}</b></div>
 ${state.recurring.map(x=>`<div class="row small"><span>${esc(x[0])}</span><span>${euro(x[1])}/mo</span></div>`).join("")}
 </div><div class="card"><b>Other planned monthly spending</b>
 <div class="row"><span>Gifts</span><span>${euro(state.gifts)}</span></div>
 <div class="row"><span>Weekend food</span><span>${euro(state.weekendFood)}</span></div>
 <div class="row"><span>General</span><span>${euro(state.general)}</span></div>
 <div class="row"><b>Planned total</b><b>${euro(planned())}</b></div></div>`;
}
function plan(){
 const max=state.startingSavings+state.annualPay*2, p=projected();
 return `<div class="top"><h1>2-Year Plan</h1><div class="muted">Current assumptions</div></div>
 <div class="grid"><div class="metric"><span class="muted">Starting savings</span><b>${euro(state.startingSavings)}</b></div>
 <div class="metric"><span class="muted">2-year income</span><b>${euro(state.annualPay*2)}</b></div>
 <div class="metric"><span class="muted">Theoretical max</span><b>${euro(max)}</b></div>
 <div class="metric"><span class="muted">Target</span><b>${euro(state.target)}</b></div></div>
 <div class="card"><div class="muted">Projected finish</div><div class="big">${euro(p)}</div>
 <div class="row"><span>Buffer above target</span><b>${euro(p-state.target)}</b></div>
 <p class="muted">The €${state.flexible} flexible allowance is included every month in this projection.</p>
 <button class="secondary" onclick="settings()">Edit assumptions</button></div>
 <div class="card"><b>Normal monthly spending</b><div class="row"><span>Planned costs</span><span>${euro(planned())}</span></div><div class="row"><span>Flexible allowance</span><span>${euro(state.flexible)}</span></div><div class="row"><b>Total</b><b>${euro(planned()+state.flexible)}</b></div></div>`;
}
function openAdd(){
 document.getElementById("sheet").innerHTML=`<h2>Add spending</h2>
 <label>Description</label><input id="desc" placeholder="e.g. Dinner">
 <label>Amount (€)</label><input id="amount" type="number" step="0.01" inputmode="decimal" placeholder="0">
 <label>Category</label><select id="cat"><option>General</option><option>Food</option><option>Entertainment</option><option>Clothes</option><option>Transport</option><option>Gifts</option><option>Holiday</option><option>Other</option></select>
 <button onclick="addTx()">Add</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;
 document.getElementById("modal").classList.add("open");
}
function addTx(){
 const desc=document.getElementById("desc").value.trim()||"Spending";
 const amount=parseFloat(document.getElementById("amount").value);
 if(!amount||amount<=0)return alert("Enter a valid amount.");
 state.transactions.push({id:Date.now().toString(),month:monthKey(),desc,amount,cat:document.getElementById("cat").value});
 save();closeModal();render("home");
}
function delTx(id){state.transactions=state.transactions.filter(x=>x.id!==id);save();render("spend")}
function carry(){const r=Math.max(0,remaining());state.carry=r;save();alert("Carry-forward set to "+euro(r)+".");render("home")}
function settings(){
 document.getElementById("sheet").innerHTML=`<h2>Edit assumptions</h2>
 ${field("Starting savings","startingSavings",state.startingSavings)}
 ${field("Annual pay","annualPay",state.annualPay)}
 ${field("2-year target","target",state.target)}
 ${field("Flexible monthly allowance","flexible",state.flexible)}
 <button onclick="saveSettings()">Save</button> <button class="secondary" onclick="closeModal()">Cancel</button>
 <button class="danger" onclick="resetApp()">Reset app</button>`;
 document.getElementById("modal").classList.add("open");
}
function field(label,id,val){return `<label>${label}</label><input id="${id}" type="number" step="0.01" value="${val}">`}
function saveSettings(){["startingSavings","annualPay","target","flexible"].forEach(k=>state[k]=parseFloat(document.getElementById(k).value)||0);save();closeModal();render("plan")}
function resetApp(){if(confirm("Reset MoneyWise to the original plan?")){state=structuredClone(DEFAULT);save();closeModal();render("home")}}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.tab)));
render("home");
</script>
</body></html>
